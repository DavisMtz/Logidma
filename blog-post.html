<meta property="og:image" content="https://raw.githubusercontent.com/DavisMtz/logidma-assets/main/og-cover.png" id="ogImage" />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Artículo — Logidma" id="twTitle" />
<meta name="twitter:description" content="Blog de Logidma." id="twDesc" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500;700&family=Manrope:wght@200;300;400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0a0908; --bg-2:#111110; --surface:#16140f; --surface-2:#1b1915;
    --line:rgba(235,229,214,.08); --line-strong:rgba(235,229,214,.18);
    --cream:#ebe5d6; --cream-soft:#c9c2b0; --muted:#9a9181;
    --accent:#c4ff3a; --accent-soft:rgba(196,255,58,.12); --accent-glow:rgba(196,255,58,.4);
    --bronze:#b08d57; --maxw:1280px;
    --content-w:720px;
    --e-expo:cubic-bezier(.16,1,.3,1); --e-quart:cubic-bezier(.22,1,.36,1); --e-back:cubic-bezier(.34,1.56,.64,1);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; -webkit-text-size-adjust:100%; }

  body{
    background:var(--bg); color:var(--cream);
    font-family:'Manrope',system-ui,sans-serif;
    font-weight:300; line-height:1.6; letter-spacing:.01em;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    overflow-x:hidden; min-height:100vh; position:relative;
  }

  /* Grid background */
  body::before{
    content:""; position:fixed; inset:0; z-index:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:80px 80px; pointer-events:none;
    mask-image:radial-gradient(ellipse at center,rgba(0,0,0,.85) 0%,rgba(0,0,0,.2) 70%,transparent 100%);
    -webkit-mask-image:radial-gradient(ellipse at center,rgba(0,0,0,.85) 0%,rgba(0,0,0,.2) 70%,transparent 100%);
    animation:gridFade 1.8s var(--e-expo) .3s both;
  }
  @keyframes gridFade{ from{opacity:0;transform:scale(1.04);} to{opacity:1;transform:scale(1);} }

  /* Noise overlay */
  body::after{
    content:""; position:fixed; inset:0; z-index:1; pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix values='0 0 0 0 0.92 0 0 0 0 0.89 0 0 0 0 0.83 0 0 0 0.04 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    opacity:.4; mix-blend-mode:overlay;
  }

  main{ position:relative; z-index:2; }

  .wrap{
    max-width:var(--maxw);
    margin:0 auto;
    padding:0 clamp(20px,4vw,32px);
  }

  /* ── LOADING / ERROR STATES ── */
  .post-loading{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:60vh; gap:16px; text-align:center;
    padding:clamp(60px,10vh,100px) 20px;
  }
  .post-loading__spinner{
    width:36px; height:36px; border-radius:50%;
    border:2px solid var(--line-strong);
    border-top-color:var(--accent);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{ to{transform:rotate(360deg);} }
  .post-loading__text{
    font-family:'JetBrains Mono',monospace; font-size:11px;
    text-transform:uppercase; letter-spacing:.2em; color:var(--muted);
  }

  .post-404{
    display:none; flex-direction:column; align-items:center; justify-content:center;
    min-height:60vh; gap:16px; text-align:center;
    padding:clamp(60px,10vh,100px) 20px;
  }
  .post-404.show{ display:flex; }
  .post-404__code{
    font-family:'Instrument Serif',serif; font-style:italic;
    font-size:clamp(72px,14vw,120px); line-height:1;
    color:var(--accent); opacity:.25; letter-spacing:-.04em;
  }
  .post-404__title{
    font-family:'Instrument Serif',serif; font-weight:400;
    font-size:clamp(24px,4vw,36px); color:var(--cream-soft);
  }
  .post-404__sub{
    font-family:'JetBrains Mono',monospace; font-size:11px;
    text-transform:uppercase; letter-spacing:.18em; color:var(--muted);
  }
  .post-404__back{
    margin-top:8px;
    font-family:'JetBrains Mono',monospace; font-size:11px;
    text-transform:uppercase; letter-spacing:.18em;
    color:var(--accent); text-decoration:none;
    padding:10px 22px; border:1px solid var(--accent);
    border-radius:999px; background:var(--accent-soft);
    transition:all .35s var(--e-expo);
  }
  .post-404__back:hover{ background:var(--accent); color:var(--bg); }

  /* ── POST CONTAINER ── */
  #postContent{ display:none; }
  #postContent.show{ display:block; }

  /* ── BACK LINK ── */
  .post-back{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono',monospace; font-size:11px;
    text-transform:uppercase; letter-spacing:.18em;
    color:var(--muted); text-decoration:none;
    padding:clamp(80px,10vh,120px) 0 clamp(28px,4vh,40px);
    display:block;
    transition:color .3s var(--e-expo);
    opacity:0; animation:softUp .8s var(--e-expo) .3s forwards;
  }
  .post-back:hover{ color:var(--accent); }
  .post-back::before{ content:"← "; }
  @keyframes softUp{ to{opacity:1;transform:translateY(0);} }

  /* ── COVER IMAGE ── */
  .post-cover{
    width:100%; max-height:600px; object-fit:cover;
    border-radius:12px; display:block;
    border:1px solid var(--line);
    opacity:0; animation:coverIn 1.2s var(--e-expo) .4s forwards;
  }
  @keyframes coverIn{ to{opacity:1;} }

  .post-cover-placeholder{
    width:100%; height:clamp(240px,40vh,420px);
    border-radius:12px; overflow:hidden; position:relative;
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,var(--surface) 0%,var(--bg-2) 100%);
    opacity:0; animation:coverIn 1.2s var(--e-expo) .4s forwards;
  }
  .post-cover-placeholder::after{
    content:""; position:absolute; inset:0;
    background:
      repeating-linear-gradient(45deg, transparent 0 24px, rgba(196,255,58,.03) 24px 25px),
      radial-gradient(circle at 30% 40%, rgba(196,255,58,.08), transparent 60%);
  }
  .post-cover-placeholder__icon{
    position:relative; z-index:1;
    font-family:'Instrument Serif',serif; font-style:italic;
    font-size:72px; color:var(--accent); opacity:.3; letter-spacing:-.02em;
  }

  /* ── ARTICLE HEADER ── */
  .post-header{
    max-width:var(--content-w); margin:0 auto;
    padding-top:clamp(28px,4vh,40px);
    opacity:0; animation:softUp .9s var(--e-expo) .6s forwards;
  }

  .post-meta-top{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    margin-bottom:20px;
  }

  .post-cat{
    font-family:'JetBrains Mono',monospace; font-size:9px;
    letter-spacing:.2em; text-transform:uppercase;
    padding:4px 12px; border-radius:999px;
    border:1px solid rgba(196,255,58,.35);
    color:var(--accent); background:rgba(196,255,58,.07);
  }

  .post-readtime{
    font-family:'JetBrains Mono',monospace; font-size:9px;
    letter-spacing:.16em; text-transform:uppercase; color:var(--muted);
  }

  .post-title{
    font-family:'Instrument Serif',serif; font-weight:400;
    font-size:clamp(28px,5vw,54px); line-height:1.1; letter-spacing:-.02em;
    color:var(--cream); margin-bottom:24px;
  }

  .post-meta-bar{
    display:flex; align-items:center; gap:20px; flex-wrap:wrap;
    padding:18px 0; border-top:1px solid var(--line);
    border-bottom:1px solid var(--line); margin-bottom:clamp(32px,5vh,48px);
  }

  .post-author-line{
    display:flex; align-items:center; gap:10px;
  }
  .post-author-avatar{
    width:36px; height:36px; border-radius:50%;
    background:linear-gradient(135deg,var(--accent-soft) 0%,rgba(176,141,87,.2) 100%);
    border:1px solid var(--line-strong);
    display:flex; align-items:center; justify-content:center;
    font-family:'Instrument Serif',serif; font-style:italic;
    font-size:15px; color:var(--accent); flex-shrink:0;
  }
  .post-author-info{ display:flex; flex-direction:column; gap:2px; }
  .post-author-name{ font-size:13px; font-weight:500; color:var(--cream); }
  .post-author-role{
    font-family:'JetBrains Mono',monospace; font-size:9px;
    text-transform:uppercase; letter-spacing:.14em; color:var(--muted);
  }

  .post-date{
    font-family:'JetBrains Mono',monospace; font-size:10px;
    letter-spacing:.14em; text-transform:uppercase; color:var(--muted);
  }

  .post-tags{ display:flex; flex-wrap:wrap; gap:6px; margin-left:auto; }
  .post-tag{
    font-family:'JetBrains Mono',monospace; font-size:9px;
    text-transform:uppercase; letter-spacing:.14em;
    padding:3px 9px; border-radius:999px;
    border:1px solid var(--line-strong); color:var(--muted);
  }

  /* ── ARTICLE BODY ── */
  .post-body{
    max-width:var(--content-w); margin:0 auto;
    opacity:0; animation:softUp .9s var(--e-expo) .8s forwards;
  }

  .post-content{
    font-size:clamp(15px,1.3vw,17px); line-height:1.85;
    color:var(--cream-soft);
  }

  .post-content p{
    margin-bottom:1.4em;
  }

  .post-content h2{
    font-family:'Instrument Serif',serif; font-weight:400; font-style:italic;
    font-size:clamp(22px,3vw,32px); line-height:1.15; letter-spacing:-.01em;
    color:var(--cream); margin-top:2.2em; margin-bottom:.8em;
    padding-bottom:.5em; border-bottom:1px solid var(--line);
  }

  .post-content h3{
    font-family:'Instrument Serif',serif; font-weight:400;
    font-size:clamp(18px,2.2vw,24px); line-height:1.2; letter-spacing:-.01em;
    color:var(--cream-soft); margin-top:1.8em; margin-bottom:.6em;
  }

  .post-content strong{ color:var(--cream); font-weight:500; }

  .post-content em{ font-style:italic; color:var(--cream); }

  .post-content code{
    font-family:'JetBrains Mono',monospace; font-size:.82em;
    background:var(--surface); color:var(--accent);
    padding:2px 7px; border-radius:5px;
    border:1px solid var(--line-strong);
    letter-spacing:0;
  }

  .post-content pre{
    background:var(--surface); border:1px solid var(--line-strong);
    border-radius:10px; padding:clamp(16px,2vw,24px);
    margin:1.6em 0; overflow-x:auto;
    font-family:'JetBrains Mono',monospace; font-size:.82em;
    line-height:1.65; color:var(--cream-soft);
  }

  .post-content pre code{
    background:none; padding:0; border:none; border-radius:0; color:inherit;
  }

  .post-content ul, .post-content ol{
    padding-left:1.4em; margin-bottom:1.4em;
  }

  .post-content li{ margin-bottom:.5em; }

  .post-content blockquote{
    border-left:3px solid var(--accent);
    padding:clamp(14px,2vw,20px) clamp(16px,2.5vw,28px);
    margin:1.8em 0;
    background:var(--accent-soft); border-radius:0 8px 8px 0;
    font-family:'Instrument Serif',serif; font-style:italic;
    font-size:clamp(17px,1.8vw,21px); line-height:1.5;
    color:var(--cream);
  }

  /* ── AUTHOR BIO ── */
  .post-author-card{
    max-width:var(--content-w); margin:clamp(48px,7vh,72px) auto 0;
    padding:clamp(24px,3vw,36px);
    background:linear-gradient(135deg,var(--surface) 0%,var(--bg-2) 100%);
    border:1px solid var(--line-strong); border-radius:14px;
    display:flex; align-items:center; gap:clamp(18px,3vw,28px);
    flex-wrap:wrap;
    opacity:0; animation:softUp .9s var(--e-expo) 1s forwards;
  }

  .post-author-card__avatar{
    width:clamp(56px,6vw,72px); height:clamp(56px,6vw,72px);
    border-radius:50%; flex-shrink:0;
    background:linear-gradient(135deg,var(--accent-soft) 0%,rgba(176,141,87,.2) 100%);
    border:1px solid var(--line-strong);
    display:flex; align-items:center; justify-content:center;
    font-family:'Instrument Serif',serif; font-style:italic;
    font-size:clamp(22px,3vw,30px); color:var(--accent);
  }

  .post-author-card__info{ flex:1; min-width:180px; }
  .post-author-card__label{
    font-family:'JetBrains Mono',monospace; font-size:9px;
    text-transform:uppercase; letter-spacing:.2em; color:var(--muted);
    margin-bottom:6px;
  }
  .post-author-card__name{
    font-family:'Instrument Serif',serif; font-weight:400;
    font-size:clamp(18px,2vw,24px); color:var(--cream); margin-bottom:4px;
  }
  .post-author-card__role{
    font-family:'JetBrains Mono',monospace; font-size:10px;
    text-transform:uppercase; letter-spacing:.14em; color:var(--bronze);
  }

  /* ── CTA SECTION ── */
  .post-cta{
    margin:clamp(64px,10vh,96px) 0;
    padding:clamp(40px,6vw,64px) clamp(28px,4vw,48px);
    background:linear-gradient(135deg,var(--surface) 0%,var(--bg-2) 60%,rgba(196,255,58,.04) 100%);
    border:1px solid var(--line-strong); border-radius:16px;
    text-align:center; position:relative; overflow:hidden;
    opacity:0; animation:softUp .9s var(--e-expo) 1.1s forwards;
  }
  .post-cta::before{
    content:""; position:absolute; inset:0;
    background:radial-gradient(circle at 50% 100%, rgba(196,255,58,.06) 0%, transparent 60%);
    pointer-events:none;
  }
  .post-cta::after{
    content:""; position:absolute; top:0; left:10%; right:10%; height:1px;
    background:linear-gradient(90deg,transparent,var(--accent-glow),transparent);
  }

  .post-cta__label{
    font-family:'JetBrains Mono',monospace; font-size:10px;
    text-transform:uppercase; letter-spacing:.22em; color:var(--accent);
    margin-bottom:16px; position:relative;
  }

  .post-cta__title{
    font-family:'Instrument Serif',serif; font-weight:400; font-style:italic;
    font-size:clamp(22px,4vw,38px); line-height:1.15; color:var(--cream);
    letter-spacing:-.01em; margin-bottom:28px; position:relative;
  }

  .post-cta__btn{
    display:inline-flex; align-items:center; gap:10px;
    font-family:'JetBrains Mono',monospace; font-size:11px;
    text-transform:uppercase; letter-spacing:.2em;
    padding:16px 34px; border-radius:999px;
    background:var(--accent); color:var(--bg);
    text-decoration:none; border:none; cursor:pointer;
    transition:all .4s var(--e-expo);
    box-shadow:0 0 24px -4px var(--accent-glow);
    position:relative;
  }
  .post-cta__btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 32px -2px var(--accent-glow);
  }
  .post-cta__btn::after{
    content:"→"; transition:transform .35s var(--e-expo);
  }
  .post-cta__btn:hover::after{ transform:translateX(5px); }

  /* ── RELATED POSTS ── */
  .post-related{
    padding:clamp(48px,7vh,72px) 0 clamp(80px,12vh,120px);
    border-top:1px solid var(--line);
    opacity:0; animation:softUp .9s var(--e-expo) 1.2s forwards;
  }

  .post-related__header{
    display:flex; align-items:center; gap:14px;
    font-family:'JetBrains Mono',monospace; font-size:10px;
    text-transform:uppercase; letter-spacing:.2em; color:var(--muted);
    margin-bottom:clamp(28px,4vh,40px);
  }
  .post-related__header::before{
    content:""; width:20px; height:1px; background:var(--accent); flex-shrink:0;
    box-shadow:0 0 6px var(--accent-glow);
  }
  .post-related__header .rh-num{ color:var(--accent); }
  .post-related__header .rh-title{ color:var(--cream-soft); }

  .related-grid{
    display:grid; grid-template-columns:repeat(3,1fr);
    gap:clamp(14px,2vw,20px);
  }
  @media(max-width:900px){ .related-grid{ grid-template-columns:1fr 1fr; } }
  @media(max-width:560px){ .related-grid{ grid-template-columns:1fr; } }

  .related-card{
    background:linear-gradient(180deg,var(--bg-2) 0%,rgba(17,17,16,.5) 100%);
    border:1px solid var(--line); border-radius:12px; overflow:hidden;
    text-decoration:none; color:var(--cream); display:flex; flex-direction:column;
    transition:border-color .4s var(--e-expo), transform .4s var(--e-expo);
  }
  .related-card:hover{ border-color:var(--line-strong); transform:translateY(-3px); }

  .related-card__thumb{
    width:100%; height:140px; object-fit:cover; display:block;
    background:linear-gradient(135deg,var(--surface) 0%,var(--bg-2) 100%);
  }
  .related-card__thumb-placeholder{
    width:100%; height:140px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,var(--surface) 0%,var(--bg-2) 100%);
    font-family:'Instrument Serif',serif; font-style:italic;
    font-size:36px; color:var(--accent); opacity:.3;
    position:relative; overflow:hidden;
  }
  .related-card__thumb-placeholder::after{
    content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(45deg, transparent 0 18px, rgba(196,255,58,.03) 18px 19px);
  }

  .related-card__body{ padding:clamp(14px,2vw,20px); flex:1; display:flex; flex-direction:column; gap:8px; }
  .related-card__cat{
    font-family:'JetBrains Mono',monospace; font-size:9px;
    text-transform:uppercase; letter-spacing:.18em; color:var(--muted);
  }
  .related-card__title{
    font-family:'Instrument Serif',serif; font-weight:400;
    font-size:clamp(15px,1.4vw,18px); line-height:1.25; color:var(--cream);
    transition:color .3s;
  }
  .related-card:hover .related-card__title{ color:var(--accent); }
  .related-card__date{
    font-family:'JetBrains Mono',monospace; font-size:9px;
    text-transform:uppercase; letter-spacing:.12em; color:var(--muted);
    margin-top:auto;
  }
</style>
</head>

<body>

<div id="siteNav"></div>

<main>
  <div class="wrap">

    <!-- Loading state -->
    <div class="post-loading" id="postLoading">
      <div class="post-loading__spinner" aria-hidden="true"></div>
      <p class="post-loading__text">Cargando artículo…</p>
    </div>

    <!-- 404 / Error state -->
    <div class="post-404" id="post404">
      <div class="post-404__code" aria-hidden="true">404</div>
      <p class="post-404__title">Artículo no encontrado</p>
      <p class="post-404__sub">Este artículo no existe o no está publicado</p>
      <a href="/blog.html" class="post-404__back">← Volver al Blog</a>
    </div>

    <!-- Post content -->
    <div id="postContent">

      <!-- Back link -->
      <a href="/blog.html" class="post-back">Volver al Blog</a>

      <!-- Cover image -->
      <div id="postCoverWrap"></div>

      <!-- Header -->
      <header class="post-header" id="postHeader"></header>

      <!-- Body -->
      <div class="post-body">
        <div class="post-content" id="postBody"></div>
      </div>

      <!-- Author bio card -->
      <div id="postAuthorCard"></div>

      <!-- CTA -->
      <div class="post-cta">
        <p class="post-cta__label">Siguiente paso</p>
        <h2 class="post-cta__title">¿Listo para sistematizar<br>tu empresa?</h2>
        <a href="/onboarding.html" class="post-cta__btn">Construir sistema</a>
      </div>

    </div><!-- /postContent -->

  </div><!-- /wrap -->

  <!-- Related posts (full-width wrap) -->
  <section class="post-related" id="postRelated" hidden>
    <div class="wrap">
      <div class="post-related__header">
        <span class="rh-num">//</span>
        <span class="rh-title">Más artículos</span>
      </div>
      <div class="related-grid" id="relatedGrid"></div>
    </div>
  </section>

</main>

<div id="siteFooter"></div>

<script type="module">
import { db } from './assets/js/firebase-init.js';
import {
  collection, doc, getDoc, getDocs, query, orderBy, where, limit
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

// ── UTILITIES ─────────────────────────────────────────────────────────────
function escHtml(str) {
  return String(str ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function formatDate(ts) {
  let date;
  if (!ts) return '';
  if (ts && typeof ts.toDate === 'function') {
    date = ts.toDate();
  } else if (ts instanceof Date) {
    date = ts;
  } else if (typeof ts === 'number') {
    date = new Date(ts);
  } else if (ts.seconds) {
    date = new Date(ts.seconds * 1000);
  } else {
    date = new Date(ts);
  }
  return new Intl.DateTimeFormat('es-MX', {
    year: 'numeric', month: 'long', day: 'numeric'
  }).format(date);
}

function countWords(str) {
  return String(str ?? '').trim().split(/\s+/).filter(Boolean).length;
}

function readTime(content) {
  return Math.max(1, Math.ceil(countWords(content) / 200));
}

// ── MINI MARKDOWN RENDERER ────────────────────────────────────────────────
function renderMarkdown(raw) {
  if (!raw) return '';
  const lines = String(raw).split('\n');
  let html = '';
  let inPre = false;

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i];

    // Code block (triple backtick fence)
    if (line.trim().startsWith('```')) {
      if (!inPre) {
        html += '<pre><code>';
        inPre = true;
      } else {
        html += '</code></pre>\n';
        inPre = false;
      }
      continue;
    }
    if (inPre) {
      html += escHtml(line) + '\n';
      continue;
    }

    // Headings
    if (/^# (.+)/.test(line)) {
      html += `<h2>${inline(line.replace(/^# /, ''))}</h2>\n`;
      continue;
    }
    if (/^## (.+)/.test(line)) {
      html += `<h3>${inline(line.replace(/^## /, ''))}</h3>\n`;
      continue;
    }
    // Blockquote
    if (/^> (.+)/.test(line)) {
      html += `<blockquote>${inline(line.replace(/^> /, ''))}</blockquote>\n`;
      continue;
    }
    // Unordered list item
    if (/^[-*] (.+)/.test(line)) {
      html += `<ul><li>${inline(line.replace(/^[-*] /, ''))}</li></ul>\n`;
      continue;
    }
    // Ordered list item
    if (/^\d+\. (.+)/.test(line)) {
      html += `<ol><li>${inline(line.replace(/^\d+\. /, ''))}</li></ol>\n`;
      continue;
    }
    // Blank line → paragraph break
    if (line.trim() === '') {
      html += '\n';
      continue;
    }
    // Regular paragraph text
    html += `<p>${inline(line)}</p>\n`;
  }

  if (inPre) html += '</code></pre>\n';

  // Merge adjacent list items
  html = html.replace(/<\/ul>\n<ul>/g, '\n');
  html = html.replace(/<\/ol>\n<ol>/g, '\n');

  return html;
}

function inline(str) {
  if (!str) return '';
  return str
    // Bold
    .replace(/\*\*(.+?)\*\*/g, (_, t) => `<strong>${escHtml(t)}</strong>`)
    // Italic (single *)
    .replace(/\*(.+?)\*/g, (_, t) => `<em>${escHtml(t)}</em>`)
    // Inline code
    .replace(/`([^`]+)`/g, (_, t) => `<code>${escHtml(t)}</code>`)
    // Remaining text escaped
    .replace(/(?<!<[^>]*)(?!<\/?)(?<!>)([^<]+)(?!<)/g, (m) => {
      // Only escape plain text not already inside tags we added
      return m;
    });
}

function authorInitial(name) {
  const n = String(name ?? '');
  return n.trim().charAt(0).toUpperCase() || 'L';
}

// ── RENDER POST ───────────────────────────────────────────────────────────
function renderPost(postId, data) {
  const title   = data.title    || data.titulo    || 'Sin título';
  const content = data.content  || data.contenido || '';
  const excerpt = data.excerpt  || data.resumen   || '';
  const cover   = data.coverImage || data.imagen  || '';
  const cat     = data.category || data.categoria || '';
  const author  = data.authorName || data.author  || 'Equipo Logidma';
  const role    = data.authorRole || data.rol     || '';
  const tags    = Array.isArray(data.tags) ? data.tags : [];
  const date    = formatDate(data.publishedAt || data.fecha);
  const rt      = readTime(content);

  // ── Dynamic head ──
  document.getElementById('pageTitle').textContent  = `${title} — Logidma`;
  document.getElementById('pageDesc').setAttribute('content', excerpt || `Lee ${title} en el blog de Logidma.`);
  document.getElementById('canonicalLink').setAttribute('href', `https://logidma.com/blog-post.html?id=${postId}`);
  document.getElementById('ogTitle').setAttribute('content', title);
  document.getElementById('ogDesc').setAttribute('content', excerpt || `Lee ${title} en el blog de Logidma.`);
  document.getElementById('ogUrl').setAttribute('content', `https://logidma.com/blog-post.html?id=${postId}`);
  if (cover) document.getElementById('ogImage').setAttribute('content', cover);
  document.getElementById('twTitle').setAttribute('content', title);
  document.getElementById('twDesc').setAttribute('content', excerpt || `Lee ${title} en el blog de Logidma.`);

  // ── Cover ──
  const coverWrap = document.getElementById('postCoverWrap');
  if (cover) {
    coverWrap.innerHTML = `<img class="post-cover" src="${escHtml(cover)}" alt="${escHtml(title)}" loading="eager" decoding="async">`;
  } else {
    coverWrap.innerHTML = `
      <div class="post-cover-placeholder" aria-hidden="true">
        <span class="post-cover-placeholder__icon">✦</span>
      </div>`;
  }

  // ── Header ──
  const tagsHtml = tags.length
    ? `<div class="post-tags">${tags.map(t => `<span class="post-tag">${escHtml(t)}</span>`).join('')}</div>`
    : '';

  document.getElementById('postHeader').innerHTML = `
    <div class="post-meta-top">
      ${cat ? `<span class="post-cat">${escHtml(cat)}</span>` : ''}
      <span class="post-readtime">${rt} min lectura</span>
    </div>
    <h1 class="post-title">${escHtml(title)}</h1>
    <div class="post-meta-bar">
      <div class="post-author-line">
        <div class="post-author-avatar" aria-hidden="true">${escHtml(authorInitial(author))}</div>
        <div class="post-author-info">
          <span class="post-author-name">${escHtml(author)}</span>
          ${role ? `<span class="post-author-role">${escHtml(role)}</span>` : ''}
        </div>
      </div>
      ${date ? `<span class="post-date">${escHtml(date)}</span>` : ''}
      ${tagsHtml}
    </div>
  `;

  // ── Body ──
  document.getElementById('postBody').innerHTML = renderMarkdown(content);

  // ── Author card ──
  document.getElementById('postAuthorCard').innerHTML = `
    <div class="post-author-card">
      <div class="post-author-card__avatar" aria-hidden="true">${escHtml(authorInitial(author))}</div>
      <div class="post-author-card__info">
        <p class="post-author-card__label">Autor</p>
        <p class="post-author-card__name">${escHtml(author)}</p>
        ${role ? `<p class="post-author-card__role">${escHtml(role)}</p>` : ''}
      </div>
    </div>
  `;

  // ── Show content ──
  document.getElementById('postContent').classList.add('show');
}

// ── RENDER RELATED ────────────────────────────────────────────────────────
function renderRelated(posts) {
  if (!posts.length) return;

  const grid = document.getElementById('relatedGrid');
  const section = document.getElementById('postRelated');

  grid.innerHTML = posts.map(({ id, data }) => {
    const title = data.title || data.titulo || 'Sin título';
    const cat   = data.category || data.categoria || '';
    const cover = data.coverImage || data.imagen || '';
    const date  = formatDate(data.publishedAt || data.fecha);

    const thumbHtml = cover
      ? `<img class="related-card__thumb" src="${escHtml(cover)}" alt="${escHtml(title)}" loading="lazy" decoding="async">`
      : `<div class="related-card__thumb-placeholder" aria-hidden="true">✦</div>`;

    return `
      <a class="related-card" href="/blog-post.html?id=${escHtml(id)}">
        ${thumbHtml}
        <div class="related-card__body">
          ${cat ? `<span class="related-card__cat">${escHtml(cat)}</span>` : ''}
          <h3 class="related-card__title">${escHtml(title)}</h3>
          ${date ? `<span class="related-card__date">${escHtml(date)}</span>` : ''}
        </div>
      </a>
    `;
  }).join('');

  section.hidden = false;
}

// ── MAIN ──────────────────────────────────────────────────────────────────
async function main() {
  const params = new URLSearchParams(window.location.search);
  const postId = params.get('id');

  const loadingEl = document.getElementById('postLoading');
  const notFoundEl = document.getElementById('post404');

  if (!postId) {
    loadingEl.style.display = 'none';
    notFoundEl.classList.add('show');
    return;
  }

  try {
    // Fetch the specific post
    const docRef = doc(collection(db, 'blog_posts'), postId);
    const snap = await getDoc(docRef);

    if (!snap.exists() || snap.data().status !== 'published') {
      loadingEl.style.display = 'none';
      notFoundEl.classList.add('show');
      return;
    }

    loadingEl.style.display = 'none';
    renderPost(postId, snap.data());

    // Fetch related posts (3 most recent published, excluding current)
    try {
      const relatedQ = query(
        collection(db, 'blog_posts'),
        where('status', '==', 'published'),
        orderBy('publishedAt', 'desc'),
        limit(4)
      );
      const relatedSnap = await getDocs(relatedQ);
      const related = relatedSnap.docs
        .filter(d => d.id !== postId)
        .slice(0, 3)
        .map(d => ({ id: d.id, data: d.data() }));

      renderRelated(related);
    } catch (relErr) {
      // Related posts failing is non-critical
      console.warn('[Blog Post] Error cargando relacionados:', relErr);
    }

  } catch (err) {
    console.error('[Blog Post] Error:', err);
    loadingEl.style.display = 'none';
    notFoundEl.classList.add('show');
    notFoundEl.querySelector('.post-404__title').textContent = 'Error al cargar el artículo';
    notFoundEl.querySelector('.post-404__sub').textContent = 'Por favor, intenta más tarde';
  }
}

main();
</script>
