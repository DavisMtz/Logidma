<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0908" />
<title>Casos de estudio — Logidma</title>
<meta name="description" content="Empresas que sistematizaron con Logidma. Resultados reales, métricas concretas, sin maquillaje." />

<link rel="canonical" href="https://logidma.com/casos.html" />
<link rel="manifest" href="/manifest.json" />

<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://plausible.io https://www.gstatic.com/firebasejs/;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src 'self' https://fonts.gstatic.com;
  img-src 'self' data: https:;
  connect-src 'self' https://plausible.io https://firestore.googleapis.com https://*.firebaseio.com https://identitytoolkit.googleapis.com;
  object-src 'none';
  base-uri 'self';
">

<meta property="og:type" content="website" />
<meta property="og:site_name" content="Logidma" />
<meta property="og:title" content="Casos de estudio — Logidma" />
<meta property="og:description" content="Resultados reales de empresas que sistematizaron con nosotros." />
<meta property="og:url" content="https://logidma.com/casos.html" />
<meta property="og:locale" content="es_MX" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500;700&family=Manrope:wght@200;300;400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0a0908; --bg-2:#111110; --surface:#16140f; --surface-2:#1b1915;
    --line:rgba(235,229,214,.08); --line-strong:rgba(235,229,214,.18);
    --cream:#ebe5d6; --cream-soft:#c9c2b0; --muted:#9a9181;
    --accent:#c4ff3a; --accent-soft:rgba(196,255,58,.12); --accent-glow:rgba(196,255,58,.4);
    --bronze:#b08d57; --maxw:1280px;
    --e-expo:cubic-bezier(.16,1,.3,1); --e-quart:cubic-bezier(.22,1,.36,1); --e-back:cubic-bezier(.34,1.56,.64,1);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
  body{
    background:var(--bg); color:var(--cream);
    font-family:'Manrope',system-ui,sans-serif;
    font-weight:300; line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden; min-height:100vh;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:80px 80px; pointer-events:none;
    mask-image:radial-gradient(ellipse at center,rgba(0,0,0,.85) 0%,rgba(0,0,0,.2) 70%,transparent 100%);
    -webkit-mask-image:radial-gradient(ellipse at center,rgba(0,0,0,.85) 0%,rgba(0,0,0,.2) 70%,transparent 100%);
    animation: gridFade 1.8s var(--e-expo) .3s both;
  }
  @keyframes gridFade{ from{opacity:0;transform:scale(1.04);} to{opacity:1;transform:scale(1);} }
  body::after{
    content:""; position:fixed; inset:0; z-index:1; pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix values='0 0 0 0 0.92 0 0 0 0 0.89 0 0 0 0 0.83 0 0 0 0.04 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    opacity:.4; mix-blend-mode:overlay;
  }

  /* NAV */
  .nav{
    position:fixed; top:0; left:0; right:0; z-index:50;
    padding:16px 32px;
    display:flex; justify-content:space-between; align-items:center;
    background:rgba(10,9,8,.78);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
    opacity:0; transform:translateY(-8px);
    animation:navIn .8s var(--e-expo) .2s forwards;
  }
  @keyframes navIn{ to{opacity:1;transform:translateY(0);} }
  .nav__brand{ display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--cream); font-family:'Instrument Serif',serif; font-size:22px; }
  .nav__brand-dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 12px var(--accent-glow); animation:dotPulse 2.4s ease-in-out infinite; }
  @keyframes dotPulse{ 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.55;transform:scale(.85);} }
  .nav__links{ display:flex; gap:22px; align-items:center; }
  .nav__link{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--cream-soft); text-decoration:none; transition:color .3s var(--e-expo); }
  .nav__link:hover{ color:var(--accent); }
  @media (max-width:720px){ .nav__links{ display:none; } }

  main{
    position:relative; z-index:2;
    max-width:var(--maxw); margin:0 auto;
    padding:130px 32px 96px;
  }

  .hero{ max-width:880px; margin-bottom:48px; }
  .hero__label{
    display:inline-flex; align-items:center; gap:10px;
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--accent); padding:6px 12px;
    background:var(--accent-soft); border:1px solid var(--accent); border-radius:999px;
    opacity:0; transform:translateY(10px); animation:pillIn 1s var(--e-back) .4s forwards;
  }
  .hero__label::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--accent); animation:dotPulse 1.6s ease-in-out infinite; }
  @keyframes pillIn{ to{opacity:1;transform:translateY(0);} }
  .hero__title{
    font-family:'Instrument Serif',serif;
    font-size:clamp(40px, 7vw, 72px);
    line-height:1.04; letter-spacing:-.02em;
    margin-top:22px; font-weight:400;
  }
  .hero__title em{ font-style:italic; color:var(--accent); }
  .hero__title .word{ display:inline-block; opacity:0; transform:translateY(40px); animation:wordIn 1.1s var(--e-expo) forwards; }
  @keyframes wordIn{ to{opacity:1;transform:translateY(0);} }
  .hero__sub{
    margin-top:22px;
    font-size:17px; color:var(--cream-soft);
    max-width:640px;
    opacity:0; transform:translateY(16px);
    animation:softUp 1s var(--e-expo) 1.4s forwards;
  }
  @keyframes softUp{ to{opacity:1;transform:translateY(0);} }

  /* FILTROS */
  .filters{
    display:flex; flex-wrap:wrap; gap:10px;
    margin-bottom:40px;
    opacity:0; transform:translateY(12px);
    animation:softUp 1s var(--e-expo) 1.6s forwards;
  }
  .filter{
    padding:9px 16px;
    background:transparent;
    border:1px solid var(--line-strong);
    border-radius:999px;
    color:var(--cream-soft);
    cursor:pointer;
    font-family:'JetBrains Mono',monospace;
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    transition:all .35s var(--e-expo);
  }
  .filter:hover{ color:var(--cream); border-color:var(--cream-soft); }
  .filter.is-active{
    background:var(--accent-soft);
    border-color:var(--accent);
    color:var(--accent);
  }

  /* GRID */
  .cases{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:20px;
  }
  @media (max-width:900px){ .cases{ grid-template-columns:1fr; } }

  .case{
    position:relative;
    padding:34px 30px;
    background:linear-gradient(180deg, var(--bg-2) 0%, rgba(17,17,16,.4) 100%);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    opacity:0; transform:translateY(28px);
    animation:caseIn 1s var(--e-expo) forwards;
    transition:border-color .5s var(--e-expo), transform .5s var(--e-expo), background .5s var(--e-expo);
  }
  .case:nth-child(1){ animation-delay:1.7s; }
  .case:nth-child(2){ animation-delay:1.82s; }
  .case:nth-child(3){ animation-delay:1.94s; }
  .case:nth-child(4){ animation-delay:2.06s; }
  .case:nth-child(5){ animation-delay:2.18s; }
  .case:nth-child(6){ animation-delay:2.30s; }
  @keyframes caseIn{ to{opacity:1;transform:translateY(0);} }

  .case::before{
    content:""; position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg, transparent 0%, var(--accent) 50%, transparent 100%);
    opacity:0; transition:opacity .6s var(--e-expo);
  }
  .case:hover{
    border-color:var(--line-strong);
    transform:translateY(-3px);
    background:linear-gradient(180deg, var(--surface) 0%, rgba(22,20,15,.4) 100%);
  }
  .case:hover::before{ opacity:1; }

  .case__head{ display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:18px; }
  .case__industry{
    font-family:'JetBrains Mono',monospace;
    font-size:10px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--bronze);
  }
  .case__tag{
    font-family:'JetBrains Mono',monospace;
    font-size:9px; letter-spacing:.18em; text-transform:uppercase;
    padding:4px 9px; border-radius:999px;
    background:var(--accent-soft); color:var(--accent);
    border:1px solid var(--accent);
    white-space:nowrap;
  }

  .case__name{
    font-family:'Instrument Serif',serif;
    font-size:26px; line-height:1.15;
    color:var(--cream); font-weight:400;
    margin-bottom:14px;
  }
  .case__name em{ font-style:italic; color:var(--accent); }

  .case__problem{
    color:var(--cream-soft);
    font-size:14px;
    margin-bottom:20px;
    line-height:1.6;
  }
  .case__problem-label{
    font-family:'JetBrains Mono',monospace;
    font-size:9px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--muted);
    display:block; margin-bottom:6px;
  }

  .case__metrics{
    display:grid; grid-template-columns:1fr 1fr; gap:14px;
    padding:18px 0;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    margin-bottom:18px;
  }
  .metric{ text-align:center; }
  .metric__num{
    font-family:'Instrument Serif',serif;
    font-size:32px; line-height:1; color:var(--accent);
    font-weight:400; font-style:italic;
  }
  .metric__label{
    font-family:'JetBrains Mono',monospace;
    font-size:10px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--cream-soft);
    margin-top:8px;
  }

  .case__quote{
    font-family:'Instrument Serif',serif;
    font-size:16px; line-height:1.5;
    color:var(--cream-soft);
    font-style:italic;
    padding-left:14px;
    border-left:2px solid var(--accent);
  }
  .case__author{
    margin-top:10px;
    font-family:'JetBrains Mono',monospace;
    font-size:10px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted);
  }

  /* CTA FINAL */
  .final{
    margin-top:80px;
    padding:56px 40px;
    background:linear-gradient(135deg, var(--surface) 0%, var(--bg-2) 100%);
    border:1px solid var(--line-strong);
    border-radius:18px;
    text-align:center; position:relative; overflow:hidden;
  }
  .final::before{
    content:""; position:absolute;
    width:400px; height:400px;
    top:-200px; right:-200px;
    background:radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
    filter:blur(80px);
  }
  .final__title{
    position:relative;
    font-family:'Instrument Serif',serif;
    font-size:clamp(28px, 4vw, 40px);
    line-height:1.15; font-weight:400;
    max-width:640px; margin:0 auto;
  }
  .final__title em{ font-style:italic; color:var(--accent); }
  .final__sub{
    position:relative;
    margin-top:16px;
    color:var(--cream-soft); font-size:15px;
  }
  .final__ctas{
    position:relative;
    margin-top:28px;
    display:flex; gap:12px; flex-wrap:wrap; justify-content:center;
  }
  .final__cta{
    display:inline-flex; align-items:center; gap:10px;
    padding:14px 26px;
    border-radius:999px; text-decoration:none;
    font-weight:500; font-size:14px;
    transition:all .35s var(--e-expo);
  }
  .final__cta--primary{ background:var(--accent); color:#0a0908; }
  .final__cta--primary:hover{ transform:translateY(-2px); box-shadow:0 14px 36px var(--accent-glow); }
  .final__cta--ghost{ background:transparent; color:var(--cream); border:1px solid var(--line-strong); }
  .final__cta--ghost:hover{ border-color:var(--accent); color:var(--accent); background:var(--accent-soft); transform:translateY(-2px); }

  .foot{
    margin-top:64px; padding-top:28px;
    border-top:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:14px;
  }
  .foot__txt, .foot__link{
    font-family:'JetBrains Mono',monospace;
    font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted);
  }
  .foot__link{ color:var(--cream-soft); text-decoration:none; transition:color .3s var(--e-expo); }
  .foot__link:hover{ color:var(--accent); }

  @media (max-width:880px){
    main{ padding:110px 22px 64px; }
    .case{ padding:26px 22px; }
    .final{ padding:40px 22px; }
  }

  .case[hidden]{ display:none !important; }

  /* Loading skeleton */
  .case-skeleton{
    padding:34px 30px;
    background:linear-gradient(180deg, var(--bg-2) 0%, rgba(17,17,16,.4) 100%);
    border:1px solid var(--line); border-radius:16px;
    animation:shimmer 1.6s ease-in-out infinite;
  }
  .case-skeleton .sk-line{
    height:14px; border-radius:4px;
    background:linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%);
    background-size:200% 100%;
    animation:shimmerMove 1.6s ease-in-out infinite;
    margin-bottom:12px;
  }
  .case-skeleton .sk-line:first-child{ width:40%; height:10px; margin-bottom:20px; }
  .case-skeleton .sk-line:nth-child(2){ width:70%; height:20px; margin-bottom:16px; }
  .case-skeleton .sk-line:nth-child(3){ width:90%; }
  .case-skeleton .sk-line:nth-child(4){ width:80%; }
  @keyframes shimmerMove{ from{background-position:200% 0;} to{background-position:-200% 0;} }

  /* Empty state */
  .cases-empty{
    grid-column:1/-1; text-align:center; padding:64px 24px;
    color:var(--muted);
    font-family:'JetBrains Mono',monospace; font-size:13px; letter-spacing:.08em;
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration:.001ms !important; }
  }
</style>
</head>
<body>

<div id="siteNav"></div>

<main>
  <section class="hero">
    <div class="hero__label"><span>Casos de estudio</span></div>
    <h1 class="hero__title" id="heroTitle"></h1>
    <p class="hero__sub">Empresas que sistematizaron con Logidma. Resultados reales, métricas concretas, sin maquillaje. Los nombres se anonimizaron por confidencialidad.</p>
  </section>

  <div class="filters" role="tablist" aria-label="Filtrar casos">
    <button class="filter is-active" data-filter="all" type="button" role="tab" aria-selected="true">Todos</button>
    <button class="filter" data-filter="automatizacion" type="button" role="tab" aria-selected="false">Automatización</button>
    <button class="filter" data-filter="workspace" type="button" role="tab" aria-selected="false">Workspace</button>
    <button class="filter" data-filter="blindaje" type="button" role="tab" aria-selected="false">Blindaje legal</button>
  </div>

  <section class="cases" id="casesGrid" aria-label="Casos de estudio">
    <div class="case-skeleton"><div class="sk-line"></div><div class="sk-line"></div><div class="sk-line"></div><div class="sk-line"></div></div>
    <div class="case-skeleton"><div class="sk-line"></div><div class="sk-line"></div><div class="sk-line"></div><div class="sk-line"></div></div>
    <div class="case-skeleton"><div class="sk-line"></div><div class="sk-line"></div><div class="sk-line"></div><div class="sk-line"></div></div>
    <div class="case-skeleton"><div class="sk-line"></div><div class="sk-line"></div><div class="sk-line"></div><div class="sk-line"></div></div>
  </section>

  <section class="final">
    <h2 class="final__title">¿Listo para tener <em>tu propio caso</em>?</h2>
    <p class="final__sub">Empieza con una llamada de 30 minutos. Sin compromiso.</p>
    <div class="final__ctas">
      <a class="final__cta final__cta--primary" href="onboarding.html?ref=casos">
        Construir mi sistema
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </a>
      <a class="final__cta final__cta--ghost" href="cotizador.html">
        Calcular mi ROI
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </a>
    </div>
  </section>

</main>

<div id="siteFooter"></div>

<script type="module">
  import { escHtml } from './assets/js/sanitize.js';
  import { track, trackPageView } from './assets/js/analytics.js';
  import { db } from './assets/js/firebase-init.js';
  import { collection, getDocs, query, orderBy, where }
    from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

  // Hero título
  const lines = ['Resultados', 'reales, métricas <em>concretas</em>.'];
  const heroTitle = document.getElementById('heroTitle');
  heroTitle.innerHTML = lines.map((line, li) => {
    const parts = line.split(/(<em>.*?<\/em>)/g);
    const inner = parts.filter(Boolean).map(p => {
      if (p.startsWith('<em>')){
        const txt = p.replace(/<\/?em>/g,'');
        return `<em>${txt.split(/\s+/).filter(Boolean).map((w,i)=>`<span class="word" style="animation-delay:${(li*0.18 + i*0.07 + 0.7).toFixed(2)}s">${escHtml(w)}</span>`).join(' ')}</em>`;
      }
      return p.split(/\s+/).filter(Boolean).map((w,i)=>`<span class="word" style="animation-delay:${(li*0.18 + i*0.07 + 0.5).toFixed(2)}s">${escHtml(w)}</span>`).join(' ');
    }).join(' ');
    return `<span style="display:block;">${inner}</span>`;
  }).join('');

  // Renderizar un caso como HTML
  function renderCase(id, d, idx) {
    const delay = (1.7 + idx * 0.12).toFixed(2);
    const metrics = Array.isArray(d.metrics) ? d.metrics.slice(0, 4) : [];
    const metricsHtml = metrics.map(m => `
      <div class="metric">
        <div class="metric__num">${escHtml(m.num || '')}</div>
        <div class="metric__label">${escHtml(m.label || '')}</div>
      </div>`).join('');
    const nameParts = (d.name || '').split(/\*(.+?)\*/);
    const nameHtml = nameParts.map((p, i) => i % 2 === 1 ? `<em>${escHtml(p)}</em>` : escHtml(p)).join('');
    return `
      <article class="case" data-cat="${escHtml(d.category || 'general')}" style="animation-delay:${delay}s">
        <div class="case__head">
          <span class="case__industry">${escHtml(d.industry || '')}${d.location ? ' · ' + escHtml(d.location) : ''}</span>
          <span class="case__tag">${escHtml(d.tag || d.category || '')}</span>
        </div>
        <h2 class="case__name">${nameHtml}</h2>
        <span class="case__problem-label">Problema</span>
        <p class="case__problem">${escHtml(d.problem || '')}</p>
        <div class="case__metrics">${metricsHtml}</div>
        <p class="case__quote">${escHtml(d.quote || '')}</p>
        <p class="case__author">— ${escHtml(d.author || '')}</p>
      </article>`;
  }

  // Datos de respaldo por si Firebase no tiene casos aún
  const FALLBACK = [
    { category:'automatizacion', industry:'E-commerce', location:'CDMX', tag:'Automatización',
      name:'Tienda online de *productos artesanales*',
      problem:'Cada pedido se procesaba manualmente: copiar de WhatsApp a Excel, generar guía, enviar tracking. 2 personas dedicadas full-time.',
      metrics:[{num:'−87%',label:'Tiempo de procesamiento'},{num:'$22k',label:'Ahorro mensual MXN'}],
      quote:'"Pasé de coordinar pedidos todo el día a revisar reportes en 15 minutos por la mañana."',
      author:'Fundadora · Industria artesanal' },
    { category:'workspace', industry:'Constructora', location:'Morelia', tag:'Workspace',
      name:'Constructora con *14 colaboradores* dispersos',
      problem:'Archivos en correos personales, fotos de obra perdidas en WhatsApp, sin estructura para compartir planos con clientes.',
      metrics:[{num:'14',label:'Cuentas migradas'},{num:'3 días',label:'Setup completo'}],
      quote:'"Ya no perdemos planos. Cada obra tiene su carpeta, su calendario y sus permisos."',
      author:'Director de operaciones' },
    { category:'automatizacion', industry:'Despacho contable', location:'GDL', tag:'Automatización',
      name:'Despacho contable con *60 clientes* activos',
      problem:'Generación de reportes mensuales manualmente: 4 horas por cliente, 240 horas al mes solo en compilar datos.',
      metrics:[{num:'240h',label:'Horas/mes ahorradas'},{num:'×3',label:'Capacidad de clientes'}],
      quote:'"Lo que antes me tomaba toda la última semana del mes, ahora corre solo cada noche."',
      author:'Contador titular' },
    { category:'blindaje', industry:'Startup SaaS', location:'Querétaro', tag:'Blindaje legal',
      name:'SaaS pre-seed cerrando *contratos*',
      problem:'A punto de cerrar un cliente enterprise, sin NDA, sin contrato de prestación de servicios, sin aviso de privacidad.',
      metrics:[{num:'5',label:'Documentos blindados'},{num:'$180k',label:'Contrato cerrado MXN'}],
      quote:'"Sin esos contratos no firmábamos nada. Logidma nos dio el blindaje en 4 días."',
      author:'CEO & cofundador' },
    { category:'automatizacion', industry:'Clínica dental', location:'León', tag:'Automatización',
      name:'Clínica con *citas dispersas* en 3 canales',
      problem:'Citas en WhatsApp, llamadas, Instagram. Recordatorios manuales. 18% de no-shows mensual.',
      metrics:[{num:'−68%',label:'No-shows'},{num:'+22%',label:'Citas confirmadas'}],
      quote:'"Los recordatorios automáticos cambiaron el juego. Ya no pierdo dinero en sillones vacíos."',
      author:'Director clínico' },
    { category:'workspace', industry:'Agencia creativa', location:'Puebla', tag:'Workspace',
      name:'Agencia con *freelancers* rotando cada mes',
      problem:'Cada nuevo freelance necesitaba acceso a archivos, calendarios, herramientas. Onboarding tomaba 3 días.',
      metrics:[{num:'2h',label:'Onboarding nuevo'},{num:'100%',label:'Permisos auditados'}],
      quote:'"Cuando alguien sale del equipo, en 5 minutos cierro todos sus accesos."',
      author:'Productora ejecutiva' }
  ];

  const grid = document.getElementById('casesGrid');
  let allCases = [];

  function renderAll(data) {
    allCases = data;
    grid.innerHTML = data.length
      ? data.map((d, i) => renderCase(d.id || i, d, i)).join('')
      : '<p class="cases-empty">Próximamente más casos de éxito.</p>';
    bindFilters();
  }

  function bindFilters() {
    const filters = document.querySelectorAll('.filter');
    filters.forEach(btn => {
      btn.addEventListener('click', () => {
        filters.forEach(f => { f.classList.remove('is-active'); f.setAttribute('aria-selected','false'); });
        btn.classList.add('is-active'); btn.setAttribute('aria-selected','true');
        const cat = btn.dataset.filter;
        let visible = 0;
        grid.querySelectorAll('.case').forEach(c => {
          const show = cat === 'all' || c.dataset.cat === cat;
          c.hidden = !show;
          if (show) visible++;
        });
        if (!visible) {
          let empty = grid.querySelector('.cases-empty');
          if (!empty) { empty = document.createElement('p'); empty.className = 'cases-empty'; grid.appendChild(empty); }
          empty.textContent = 'No hay casos en esta categoría todavía.';
        } else {
          const empty = grid.querySelector('.cases-empty');
          if (empty) empty.remove();
        }
        track('casos_filter', { categoria: cat, visibles: visible });
      });
    });
  }

  // Cargar desde Firebase; usar fallback si la colección está vacía
  try {
    const snap = await getDocs(query(
      collection(db, 'casos_exito'),
      where('visible', '==', true),
      orderBy('createdAt', 'desc')
    ));
    const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderAll(docs.length ? docs : FALLBACK);
  } catch {
    renderAll(FALLBACK);
  }

  trackPageView('/casos');
</script>
