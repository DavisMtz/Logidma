<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0908" />
<title>404 — Logidma</title>
<meta name="description" content="La página que buscas no está sistematizada todavía. Pero el resto sí." />
<meta name="robots" content="noindex, follow" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500&family=Manrope:wght@200;300;400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #0a0908;
    --cream: #ebe5d6;
    --cream-soft: #c9c2b0;
    --muted: #9a9181;
    --accent: #c4ff3a;
    --accent-soft: rgba(196,255,58,0.12);
    --accent-glow: rgba(196,255,58,0.4);
    --bronze: #b08d57;
    --line: rgba(235,229,214,0.08);
    --line-strong: rgba(235,229,214,0.18);
    --e-expo: cubic-bezier(0.16, 1, 0.3, 1);
    --e-back: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    background: var(--bg); color: var(--cream);
    font-family:'Manrope',system-ui,sans-serif;
    font-weight: 300; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }

  /* Grid de fondo */
  body::before{
    content:""; position:fixed; inset:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 80px 80px;
    pointer-events:none;
    mask-image: radial-gradient(ellipse at center,rgba(0,0,0,.85) 0%,rgba(0,0,0,.2) 70%,transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse at center,rgba(0,0,0,.85) 0%,rgba(0,0,0,.2) 70%,transparent 100%);
    animation: gridIn 2s var(--e-expo) .3s both;
  }
  @keyframes gridIn{
    from{ opacity:0; transform:scale(1.05); }
    to{ opacity:1; transform:scale(1); }
  }

  /* Glow ambiental */
  body::after{
    content:""; position:fixed;
    width: 600px; height: 600px; border-radius:50%;
    top: 50%; left: 50%; transform: translate(-50%,-50%);
    background: radial-gradient(circle, var(--accent-soft) 0%, transparent 65%);
    filter: blur(100px);
    pointer-events: none;
    opacity: 0;
    animation: glowIn 2s var(--e-expo) .6s forwards;
  }
  @keyframes glowIn{ to{ opacity: 1; } }

  .wrap{
    position: relative; z-index: 2;
    text-align: center;
    padding: 40px 24px;
    max-width: 640px;
  }

  .code{
    font-family:'Instrument Serif',serif;
    font-style: italic;
    font-size: clamp(120px, 25vw, 220px);
    line-height: 1;
    color: var(--accent);
    letter-spacing: -.04em;
    position: relative;
    display: inline-block;
    opacity: 0;
    animation: codeIn 1.4s var(--e-back) .4s forwards;
    text-shadow: 0 0 60px var(--accent-glow);
  }
  @keyframes codeIn{
    from{ opacity:0; transform: translateY(40px) scale(.92); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }
  .code::after{
    content:""; position: absolute;
    bottom: 10px; left: 50%; transform: translateX(-50%);
    width: 60%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0;
    animation: lineIn 1.2s var(--e-expo) 1.3s forwards;
  }
  @keyframes lineIn{ to{ opacity:1; } }

  .label{
    font-family:'JetBrains Mono',monospace;
    font-size: 11px; letter-spacing:.24em; text-transform: uppercase;
    color: var(--muted);
    margin-top: 14px;
    opacity: 0;
    animation: softUp 1s var(--e-expo) 1.1s forwards;
  }

  .msg{
    font-family:'Instrument Serif',serif;
    font-size: clamp(24px, 4vw, 36px);
    line-height: 1.25;
    margin-top: 28px;
    color: var(--cream);
    font-weight: 400;
    opacity: 0;
    animation: softUp 1s var(--e-expo) 1.3s forwards;
  }
  .msg em{ font-style: italic; color: var(--accent); }

  .sub{
    margin-top: 18px;
    color: var(--cream-soft);
    font-size: 15px;
    line-height: 1.55;
    opacity: 0;
    animation: softUp 1s var(--e-expo) 1.5s forwards;
  }

  @keyframes softUp{
    from{ opacity:0; transform: translateY(16px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .actions{
    margin-top: 38px;
    display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
    opacity: 0;
    animation: softUp 1s var(--e-expo) 1.8s forwards;
  }

  .btn{
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 24px;
    border-radius: 999px;
    text-decoration: none;
    font-family:'Manrope',sans-serif;
    font-weight: 500;
    font-size: 14px;
    transition: all .35s var(--e-expo);
    border: 1px solid transparent;
  }
  .btn--primary{
    background: var(--accent); color: #0a0908;
  }
  .btn--primary:hover{
    transform: translateY(-2px);
    box-shadow: 0 12px 36px var(--accent-glow);
  }
  .btn--ghost{
    background: transparent; color: var(--cream);
    border-color: var(--line-strong);
  }
  .btn--ghost:hover{
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <div class="label">Página no sistematizada</div>
    <h1 class="msg">Esto no <em>existe</em>… todavía.</h1>
    <p class="sub">La ruta que pediste no está en nuestro mapa. Pero el resto del sistema sigue en pie.</p>
    <div class="actions">
      <a class="btn btn--primary" href="/">← Volver al inicio</a>
      <a class="btn btn--ghost" href="/onboarding.html">Construir un sistema</a>
    </div>
  </div>
</body>
</html>
