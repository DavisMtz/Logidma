<style>
  :root{
    --bg:#0a0908; --bg-2:#111110; --surface:#16140f; --surface-2:#1b1915;
    --line:rgba(235,229,214,.08); --line-strong:rgba(235,229,214,.18);
    --cream:#ebe5d6; --cream-soft:#c9c2b0; --muted:#9a9181;
    --accent:#c4ff3a; --accent-soft:rgba(196,255,58,.12); --accent-glow:rgba(196,255,58,.4);
    --bronze:#b08d57; --maxw:1280px;
    --e-expo:cubic-bezier(.16,1,.3,1); --e-quart:cubic-bezier(.22,1,.36,1); --e-back:cubic-bezier(.34,1.56,.64,1);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; -webkit-text-size-adjust:100%; }

  body{
    background:var(--bg); color:var(--cream);
    font-family:'Manrope',system-ui,sans-serif;
    font-weight:300; line-height:1.6; letter-spacing:.01em;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    overflow-x:hidden; min-height:100vh; position:relative;
  }

  /* Grid background */
  body::before{
    content:""; position:fixed; inset:0; z-index:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:80px 80px; pointer-events:none;
    mask-image:radial-gradient(ellipse at center,rgba(0,0,0,.85) 0%,rgba(0,0,0,.2) 70%,transparent 100%);
    -webkit-mask-image:radial-gradient(ellipse at center,rgba(0,0,0,.85) 0%,rgba(0,0,0,.2) 70%,transparent 100%);
    animation:gridFade 1.8s var(--e-expo) .3s both;
  }
  @keyframes gridFade{ from{opacity:0;transform:scale(1.04);} to{opacity:1;transform:scale(1);} }

  /* Noise overlay */
  body::after{
    content:""; position:fixed; inset:0; z-index:1; pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix values='0 0 0 0 0.92 0 0 0 0 0.89 0 0 0 0 0.83 0 0 0 0.04 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    opacity:.4; mix-blend-mode:overlay;
  }

  main{ position:relative; z-index:2; }

  .wrap{
    max-width:var(--maxw);
    margin:0 auto;
    padding:0 clamp(20px,4vw,32px);
  }

  /* ── HERO ── */
  .blog-hero{
    padding:clamp(100px,14vh,160px) 0 clamp(56px,8vh,80px);
    position:relative;
  }

  .blog-hero__label{
    display:inline-flex; align-items:center; gap:10px;
    font-family:'JetBrains Mono',monospace; font-size:11px;
    letter-spacing:.22em; text-transform:uppercase;
    color:var(--accent); padding:6px 14px;
    background:var(--accent-soft); border:1px solid var(--accent);
    border-radius:999px; margin-bottom:28px;
    opacity:0; transform:translateY(10px);
    animation:pillIn 1s var(--e-back) .3s forwards;
  }
  .blog-hero__label::before{
    content:""; width:6px; height:6px; border-radius:50%;
    background:var(--accent); animation:dotPulse 1.6s ease-in-out infinite;
  }
  @keyframes pillIn{ to{opacity:1;transform:translateY(0);} }
  @keyframes dotPulse{ 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.55;transform:scale(.85);} }

  .blog-hero__title{
    font-family:'Instrument Serif',serif; font-weight:400;
    font-size:clamp(40px,8vw,88px); line-height:1.02;
    letter-spacing:-.02em; margin-bottom:24px; max-width:14ch;
  }
  .blog-hero__title em{ font-style:italic; color:var(--accent); }
  .blog-hero__title .word{
    display:inline-block; overflow:hidden; vertical-align:top; line-height:1.05;
  }
  .blog-hero__title .word .inner{
    display:inline-block; transform:translateY(110%);
    animation:wordUp 1.1s var(--e-expo) forwards;
    animation-delay:var(--d,0s);
  }
  @keyframes wordUp{ to{transform:translateY(0);} }

  .blog-hero__sub{
    font-size:clamp(15px,1.3vw,17px); color:var(--cream-soft);
    max-width:560px; line-height:1.75;
    opacity:0; transform:translateY(14px);
    animation:softUp 1s var(--e-expo) 1.2s forwards;
  }
  @keyframes softUp{ to{opacity:1;transform:translateY(0);} }

  /* ── FILTERS ── */
  .blog-filters{
    display:flex; flex-wrap:wrap; gap:8px;
    padding:clamp(28px,4vh,40px) 0;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    opacity:0; animation:softUp 1s var(--e-expo) 1.5s forwards;
  }

  .filter-btn{
    font-family:'JetBrains Mono',monospace; font-size:10px;
    text-transform:uppercase; letter-spacing:.18em;
    padding:8px 16px; border-radius:999px; cursor:pointer;
    border:1px solid var(--line-strong); color:var(--cream-soft);
    background:transparent; transition:all .35s var(--e-expo);
    white-space:nowrap;
  }
  .filter-btn:hover{ border-color:var(--cream-soft); color:var(--cream); }
  .filter-btn.is-active{
    border-color:var(--accent); color:var(--accent);
    background:var(--accent-soft);
    box-shadow:0 0 20px -4px var(--accent-glow);
  }

  /* ── BLOG GRID ── */
  .blog-grid-section{
    padding:clamp(40px,6vh,64px) 0 clamp(80px,12vh,120px);
  }

  .blog-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:clamp(16px,2vw,24px);
  }
  @media(max-width:1000px){ .blog-grid{ grid-template-columns:1fr 1fr; } }
  @media(max-width:640px){ .blog-grid{ grid-template-columns:1fr; } }

  /* ── POST CARD ── */
  .post-card{
    position:relative;
    background:linear-gradient(180deg,var(--bg-2) 0%,rgba(17,17,16,.5) 100%);
    border:1px solid var(--line);
    border-radius:14px; overflow:hidden;
    display:flex; flex-direction:column;
    transition:border-color .5s var(--e-expo), transform .5s var(--e-expo), box-shadow .5s var(--e-expo);
    opacity:0; transform:translateY(28px);
    animation:cardIn 1s var(--e-expo) forwards;
    text-decoration:none; color:var(--cream);
    will-change:transform;
  }
  @keyframes cardIn{ to{opacity:1;transform:translateY(0);} }
  .post-card::before{
    content:""; position:absolute;
    top:0; left:0; right:0; height:2px;
    background:var(--accent);
    transform:scaleX(0); transform-origin:left;
    transition:transform .5s var(--e-expo);
    z-index:1;
    box-shadow:0 0 12px var(--accent-glow);
  }
  .post-card:hover{
    border-color:var(--line-strong);
    transform:translateY(-4px);
    box-shadow:0 16px 40px rgba(0,0,0,.4);
  }
  .post-card:hover::before{ transform:scaleX(1); }

  /* Cover */
  .post-card__cover{
    width:100%; height:200px; object-fit:cover;
    display:block; flex-shrink:0;
    background:linear-gradient(135deg,var(--surface) 0%,var(--bg-2) 100%);
  }
  .post-card__cover-placeholder{
    width:100%; height:200px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
  }
  .post-card__cover-placeholder::before{
    content:""; position:absolute; inset:0;
    background:linear-gradient(135deg,var(--surface) 0%,var(--bg-2) 100%);
  }
  .post-card__cover-placeholder::after{
    content:""; position:absolute; inset:0;
    background:
      repeating-linear-gradient(45deg, transparent 0 18px, rgba(196,255,58,.03) 18px 19px),
      radial-gradient(circle at 30% 40%, rgba(196,255,58,.08), transparent 55%);
  }
  .post-card__cover-icon{
    position:relative; z-index:1;
    font-family:'Instrument Serif',serif; font-style:italic;
    font-size:48px; color:var(--accent); opacity:.5;
    letter-spacing:-.02em;
  }

  /* Body */
  .post-card__body{
    padding:clamp(18px,2.5vw,26px);
    display:flex; flex-direction:column; flex:1; gap:10px;
  }

  .post-card__top{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }

  .post-card__cat{
    font-family:'JetBrains Mono',monospace; font-size:9px;
    letter-spacing:.2em; text-transform:uppercase;
    padding:4px 10px; border-radius:999px;
    border:1px solid currentColor;
  }
  .cat--ia{ color:var(--accent); border-color:rgba(196,255,58,.35); background:rgba(196,255,58,.07); }
  .cat--automatizacion{ color:var(--bronze); border-color:rgba(176,141,87,.35); background:rgba(176,141,87,.08); }
  .cat--legal{ color:#7cb9ff; border-color:rgba(124,185,255,.35); background:rgba(124,185,255,.07); }
  .cat--negocios{ color:#ff9e6c; border-color:rgba(255,158,108,.35); background:rgba(255,158,108,.07); }
  .cat--tecnologia{ color:var(--cream-soft); border-color:var(--line-strong); background:rgba(201,194,176,.06); }
  .cat--default{ color:var(--muted); border-color:var(--line-strong); background:transparent; }

  .post-card__date{
    font-family:'JetBrains Mono',monospace; font-size:9px;
    letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); white-space:nowrap; flex-shrink:0;
  }

  .post-card__title{
    font-family:'Instrument Serif',serif; font-size:clamp(17px,1.6vw,21px);
    line-height:1.2; letter-spacing:-.01em; color:var(--cream);
    font-weight:400; margin-top:4px;
    transition:color .3s;
  }
  .post-card:hover .post-card__title{ color:var(--accent); }

  .post-card__excerpt{
    font-size:13px; color:var(--cream-soft); line-height:1.65;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .post-card__footer{
    margin-top:auto; padding-top:16px;
    border-top:1px dashed var(--line);
    display:flex; align-items:center; justify-content:space-between;
    gap:8px;
  }

  .post-card__author{
    display:flex; flex-direction:column; gap:2px;
  }
  .post-card__author-name{
    font-size:12px; font-weight:500; color:var(--cream);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:140px;
  }
  .post-card__author-role{
    font-family:'JetBrains Mono',monospace; font-size:9px;
    letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
  }

  .post-card__cta{
    font-family:'JetBrains Mono',monospace; font-size:10px;
    text-transform:uppercase; letter-spacing:.16em;
    color:var(--accent); display:flex; align-items:center; gap:4px;
    white-space:nowrap; transition:gap .3s var(--e-expo);
    flex-shrink:0;
  }
  .post-card:hover .post-card__cta{ gap:8px; }

  /* ── SKELETON LOADING ── */
  .skeleton-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:clamp(16px,2vw,24px);
  }
  @media(max-width:1000px){ .skeleton-grid{ grid-template-columns:1fr 1fr; } }
  @media(max-width:640px){ .skeleton-grid{ grid-template-columns:1fr; } }

  .skeleton-card{
    background:var(--bg-2); border:1px solid var(--line);
    border-radius:14px; overflow:hidden;
  }
  .skeleton-cover{
    width:100%; height:200px;
    background:linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 40%, var(--surface) 80%);
    background-size:200% 100%;
    animation:shimmer 1.6s ease-in-out infinite;
  }
  .skeleton-body{ padding:24px; display:flex; flex-direction:column; gap:12px; }
  .skeleton-line{
    border-radius:4px;
    background:linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 40%, var(--surface) 80%);
    background-size:200% 100%;
    animation:shimmer 1.6s ease-in-out infinite;
  }
  .skeleton-line--cat{ height:18px; width:72px; }
  .skeleton-line--title{ height:22px; width:90%; }
  .skeleton-line--title2{ height:22px; width:70%; }
  .skeleton-line--text{ height:13px; width:100%; }
  .skeleton-line--text2{ height:13px; width:85%; }
  .skeleton-line--text3{ height:13px; width:60%; }
  .skeleton-line--author{ height:13px; width:50%; margin-top:6px; }
  @keyframes shimmer{
    0%{ background-position:200% 0; }
    100%{ background-position:-200% 0; }
  }

  /* ── EMPTY STATE ── */
  .blog-empty{
    display:none; flex-direction:column; align-items:center; justify-content:center;
    padding:clamp(60px,10vh,100px) 20px; text-align:center; gap:16px;
  }
  .blog-empty.show{ display:flex; }
  .blog-empty__icon{
    font-family:'Instrument Serif',serif; font-style:italic;
    font-size:72px; color:var(--accent); opacity:.35;
    line-height:1; margin-bottom:8px;
  }
  .blog-empty__title{
    font-family:'Instrument Serif',serif; font-size:28px; font-weight:400;
    color:var(--cream-soft);
  }
  .blog-empty__sub{
    font-family:'JetBrains Mono',monospace; font-size:11px;
    text-transform:uppercase; letter-spacing:.18em; color:var(--muted);
  }

  /* ── CARD STAGGER DELAYS ── */
  .post-card:nth-child(1){ animation-delay:.1s; }
  .post-card:nth-child(2){ animation-delay:.18s; }
  .post-card:nth-child(3){ animation-delay:.26s; }
  .post-card:nth-child(4){ animation-delay:.34s; }
  .post-card:nth-child(5){ animation-delay:.42s; }
  .post-card:nth-child(6){ animation-delay:.50s; }
  .post-card:nth-child(7){ animation-delay:.58s; }
  .post-card:nth-child(8){ animation-delay:.66s; }
  .post-card:nth-child(9){ animation-delay:.74s; }
</style>
</head>

<body>

<div id="siteNav"></div>

<main>
  <!-- HERO -->
  <section class="blog-hero">
    <div class="wrap">
      <div class="blog-hero__label">
        <span>Blog</span>
      </div>
      <h1 class="blog-hero__title" id="heroTitle" aria-label="Ideas que mueven empresas"></h1>

          <div class="skeleton-cover"></div>
          <div class="skeleton-body">
            <div class="skeleton-line skeleton-line--cat"></div>

            <div class="skeleton-line skeleton-line--title2"></div>
            <div class="skeleton-line skeleton-line--text"></div>
            <div class="skeleton-line skeleton-line--text2"></div>
            <div class="skeleton-line skeleton-line--text3"></div>
            <div class="skeleton-line skeleton-line--author"></div>
          </div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton-cover"></div>
          <div class="skeleton-body">
            <div class="skeleton-line skeleton-line--cat"></div>
            <div class="skeleton-line skeleton-line--title"></div>
            <div class="skeleton-line skeleton-line--title2"></div>
            <div class="skeleton-line skeleton-line--text"></div>
            <div class="skeleton-line skeleton-line--text2"></div>
            <div class="skeleton-line skeleton-line--text3"></div>
            <div class="skeleton-line skeleton-line--author"></div>
          </div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton-cover"></div>
          <div class="skeleton-body">
            <div class="skeleton-line skeleton-line--cat"></div>
            <div class="skeleton-line skeleton-line--title"></div>
            <div class="skeleton-line skeleton-line--title2"></div>
            <div class="skeleton-line skeleton-line--text"></div>
            <div class="skeleton-line skeleton-line--text2"></div>

      <!-- Real grid (hidden until loaded) -->
      <div class="blog-grid" id="blogGrid" aria-live="polite" hidden></div>

      <!-- Empty state -->
      <div class="blog-empty" id="blogEmpty" aria-live="polite">
        <div class="blog-empty__icon">∅</div>
        <p class="blog-empty__title">Sin artículos aquí</p>
        <p class="blog-empty__sub">Prueba con otra categoría</p>
      </div>
    </div>
  </section>
</main>

<div id="siteFooter"></div>

<script type="module">
import { db } from './assets/js/firebase-init.js';
import {
  collection, getDocs, query, orderBy, where
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

// ── HERO TITLE ANIMATION ──────────────────────────────────────────────────
const heroWords = ['Ideas', 'que', 'mueven', 'empresas'];
const heroTitle = document.getElementById('heroTitle');
heroTitle.innerHTML = heroWords.map((w, i) => {
  const delay = (0.5 + i * 0.1).toFixed(2);
  // Last word gets accent colour
  const inner = i === heroWords.length - 1
    ? `<em><span class="inner" style="--d:${delay}s">${w}</span></em>`
    : `<span class="inner" style="--d:${delay}s">${w}</span>`;
  return `<span class="word">${inner}</span>`;
}).join(' ');

// ── UTILITIES ─────────────────────────────────────────────────────────────
function formatDate(ts) {
  let date;
  if (!ts) return '';
  if (ts && typeof ts.toDate === 'function') {
    date = ts.toDate();
  } else if (ts instanceof Date) {
    date = ts;
  } else if (typeof ts === 'number') {
    date = new Date(ts);
  } else if (ts.seconds) {
    date = new Date(ts.seconds * 1000);
  } else {
    date = new Date(ts);
  }
  return new Intl.DateTimeFormat('es-MX', {
    year: 'numeric', month: 'long', day: 'numeric'
  }).format(date);
}

function catClass(cat) {
  if (!cat) return 'cat--default';
  const map = {
    'Inteligencia Artificial': 'cat--ia',
    'Automatización': 'cat--automatizacion',
    'Legal': 'cat--legal',
    'Negocios': 'cat--negocios',
    'Tecnología': 'cat--tecnologia',
  };
  return map[cat] || 'cat--default';
}

function catIcon(cat) {
  const icons = {
    'Inteligencia Artificial': '⚡',
    'Automatización': '⚙',
    'Legal': '§',
    'Negocios': '◈',
    'Tecnología': '⌘',
  };
  return icons[cat] || '✦';
}

function escHtml(str) {
  return String(str ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function buildCard(id, post) {
  const cat      = post.category || post.categoria || '';
  const title    = post.title    || post.titulo    || 'Sin título';
  const excerpt  = post.excerpt  || post.resumen   || '';
  const author   = post.authorName || post.author  || 'Equipo Logidma';
  const role     = post.authorRole || post.rol     || '';
  const cover    = post.coverImage || post.imagen  || '';
  const date     = formatDate(post.publishedAt || post.fecha);

  const coverHtml = cover
    ? `<img class="post-card__cover" src="${escHtml(cover)}" alt="${escHtml(title)}" loading="lazy" decoding="async">`
    : `<div class="post-card__cover-placeholder" aria-hidden="true"><span class="post-card__cover-icon">${catIcon(cat)}</span></div>`;

  return `
    <a class="post-card" href="/blog-post.html?id=${escHtml(id)}" data-cat="${escHtml(cat)}">
      ${coverHtml}
      <div class="post-card__body">
        <div class="post-card__top">
          <span class="post-card__cat ${catClass(cat)}">${escHtml(cat) || 'General'}</span>
          <span class="post-card__date">${escHtml(date)}</span>
        </div>
        <h2 class="post-card__title">${escHtml(title)}</h2>
        <p class="post-card__excerpt">${escHtml(excerpt)}</p>
        <div class="post-card__footer">
          <div class="post-card__author">
            <span class="post-card__author-name">${escHtml(author)}</span>
            ${role ? `<span class="post-card__author-role">${escHtml(role)}</span>` : ''}
          </div>
          <span class="post-card__cta">Leer más →</span>
        </div>
      </div>
    </a>
  `;
}

// ── FETCH + RENDER ────────────────────────────────────────────────────────
let allPosts = []; // [{id, data}]

async function loadPosts() {
  const skeletonGrid = document.getElementById('skeletonGrid');
  const blogGrid     = document.getElementById('blogGrid');
  const blogEmpty    = document.getElementById('blogEmpty');

  try {
    const q = query(
      collection(db, 'blog_posts'),
      where('status', '==', 'published'),
      orderBy('publishedAt', 'desc')
    );
    const snap = await getDocs(q);

    allPosts = snap.docs.map(d => ({ id: d.id, data: d.data() }));

    skeletonGrid.hidden = true;
    skeletonGrid.removeAttribute('aria-busy');
    blogGrid.hidden = false;

    if (allPosts.length === 0) {
      blogEmpty.classList.add('show');
      return;
    }

    renderCards(allPosts);
  } catch (err) {
    console.error('[Blog] Error cargando posts:', err);
    skeletonGrid.hidden = true;
    blogGrid.hidden = false;
    blogEmpty.classList.add('show');
    blogEmpty.querySelector('.blog-empty__title').textContent = 'Error al cargar artículos';
    blogEmpty.querySelector('.blog-empty__sub').textContent = 'Por favor, intenta más tarde';
  }
}

function renderCards(posts) {
  const blogGrid  = document.getElementById('blogGrid');
  const blogEmpty = document.getElementById('blogEmpty');

  blogEmpty.classList.remove('show');

  if (posts.length === 0) {
    blogGrid.innerHTML = '';
    blogEmpty.classList.add('show');
    return;
  }

  blogGrid.innerHTML = posts
    .map(({ id, data }) => buildCard(id, data))
    .join('');
}

// ── CLIENT-SIDE FILTER ────────────────────────────────────────────────────
document.getElementById('filterBar').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;

  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.remove('is-active');
    b.setAttribute('aria-pressed', 'false');
  });
  btn.classList.add('is-active');
  btn.setAttribute('aria-pressed', 'true');

  const cat = btn.dataset.cat;
  const filtered = cat === 'all'
    ? allPosts
    : allPosts.filter(p => (p.data.category || p.data.categoria || '') === cat);

  renderCards(filtered);
});

// ── BOOT ─────────────────────────────────────────────────────────────────
loadPosts();
</script>
